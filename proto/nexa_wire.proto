syntax = "proto3";

package nexa.wire;
option go_package = "nexa/wire";
option java_package = "com.nexa.app.core.proto";
option java_multiple_files = true;

enum PacketType {
  PACKET_UNKNOWN = 0;
  PACKET_MESSAGE = 1;
  PACKET_ACK = 2; // Final Recipient Delivery / Read ACK
  PACKET_PING = 3;
  PACKET_AUTH_CHALLENGE = 4;
  PACKET_AUTH_RESPONSE = 5;
  PACKET_AUTH_SUCCESS = 6;
  PACKET_AUTH_FAILURE = 7;
  PACKET_TYPING = 10;
  PACKET_DEVICE_SYNC = 11;
  PACKET_SIGNALING = 12;
  PACKET_REGISTER_ROUTING_TOKENS = 13;
  PACKET_PEER_SYNC = 14;
  PACKET_CUSTODY_ACK = 15; // Relay Store-and-Forward Custody ACK
}

enum AckStatus {
  ACK_UNKNOWN = 0;
  ACK_SERVER_RECEIVED = 1;
  ACK_DEVICE_DELIVERED = 2;
  ACK_DEVICE_READ = 3;
}

enum CustodyStatus {
  CUSTODY_STATUS_UNSPECIFIED = 0;
  CUSTODY_ACCEPTED = 1;
  CUSTODY_TRANSFERRED = 2;
  CUSTODY_REJECTED = 3;
  CUSTODY_EXPIRED = 4;
}

message NexaWirePacket {
  string packet_id = 1;
  PacketType type = 2;
  string sender_nx_id = 3;
  string recipient_nx_id = 4;
  int64 timestamp = 5;
  
  oneof payload {
    EncryptedMessagePayload message = 6;
    DeliveryAckPayload ack = 7;
    AuthChallengePayload auth_challenge = 8;
    AuthResponsePayload auth_response = 9;
    TypingPayload typing = 10;
    DeviceSyncPayload device_sync = 11;
    SignalingPayload signaling = 12;
    RoutingTokenRegistrationPayload routing_tokens = 13;
    PeerSyncPayload peer_sync = 14;
    CustodyAckPayload custody_ack = 15;
  }
}

message DoubleRatchetHeader {
  bytes ratchet_public_key = 1;     // Exactly 32 bytes: sender's current X25519 ratchet public key (DHR)
  uint32 previous_chain_length = 2; // PN: Number of messages in the previous sending chain
  uint32 message_index = 3;         // N: Message index in the current sending chain
  string session_id = 4;            // Canonical UUID identifying the pairwise conversation session
  int64 one_time_prekey_id = 5;     // Optional: OPK ID if this message initiates a new X3DH session
  bytes ephemeral_public_key = 6;   // Optional: 32-byte ephemeral public key (EK) for initial X3DH message
}

message EncryptedMessagePayload {
  int64 conversation_seq = 1 [deprecated = true];
  bytes ciphertext = 2;
  bytes nonce = 3 [deprecated = true];       // 32-byte Ephemeral Public Key in Double Ratchet (legacy shim)
  bytes auth_tag = 4;                        // 16-byte Poly1305 MAC tag
  DoubleRatchetHeader header = 5;            // Full Signal-compliant Double Ratchet header
  bytes aead_nonce = 6;                      // Exactly 12 bytes: ChaCha20-Poly1305 AEAD nonce
}

message DeliveryAckPayload {
  string original_packet_id = 1;
  AckStatus status = 2;
  string recipient_nx_id = 3;
  string device_id = 4;
  int64 timestamp = 5;
  bytes signature = 6;
}

message CustodyAckPayload {
  string original_packet_id = 1;
  string custodian_nx_id = 2;
  CustodyStatus status = 3;
  int64 timestamp = 4;
  bytes signature = 5;
}

message AuthChallengePayload {
  bytes challenge_nonce = 1; // 32-byte secure random nonce
  int64 timestamp = 2;
  int64 expires_at = 3;      // Expiration timestamp (timestamp + 60_000 ms)
}

message AuthResponsePayload {
  bytes signature = 1;       // 64-byte Ed25519 signature
  bytes public_key = 2;      // 32-byte Ed25519 public key
  int64 timestamp = 3;
}

message TypingPayload {
  string conversation_id = 1;
  bool is_typing = 2;
}

message DeviceSyncPayload {
  string sync_id = 1;
  string source_device_id = 2;
  int64 sequence_number = 3;
  bytes encrypted_payload = 4;
}

message SignalingPayload {
  int64 transfer_id = 1;
  string action = 2;
  string data = 3;
}

message RoutingTokenRegistrationPayload {
  repeated string tokens = 1;
}

enum PeerSyncAction {
  SYNC_UNKNOWN = 0;
  SYNC_HELLO = 1;
  SYNC_HELLO_ACK = 2;
  SYNC_INVENTORY_REQ = 3;
  SYNC_INVENTORY_RESP = 4;
  SYNC_PULL_REQ = 5;
  SYNC_PULL_RESP = 6;
  SYNC_ACK = 7;
}

message PeerSyncPayload {
  PeerSyncAction action = 1;
  string session_id = 2;
  string conversation_id = 3;
  int64 cursor_timestamp = 4;
  int64 cursor_sequence = 5;
  repeated string message_ids = 6;
  repeated bytes envelopes = 7;
  int64 sync_timestamp = 8;
  string error_message = 9;
}
