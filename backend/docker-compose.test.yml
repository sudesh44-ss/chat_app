# Disposable dependencies for the Module 1 integration suites.
#
#   docker compose -f backend/docker-compose.test.yml up -d
#   backend/scripts/run-integration-tests.ps1
#   docker compose -f backend/docker-compose.test.yml down -v
#
# Ports are intentionally non-default so these containers cannot collide with a
# developer's existing PostgreSQL/Redis instances.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: nexa-postgres-test
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_test
      POSTGRES_DB: nexa_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: nexa-redis-test
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
